  - title: "Prolific permutations and permuted packings: Downsets containing many large patterns"
    authors:
      - "David Bevan"
      - "Cheyne Homberger"
      - "Bridget Eileen Tenner"
    id: "https://doi.org/10.1016/j.jcta.2017.08.006"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 153 (2018), 98-121 (arXiv:1608.06931v3), Theorem 2.25, Corollary 4.3, Definition 4.1 and Theorem 4.2 (odd k, breadth formulation), and Conjecture 5.1"
    relationship: independently-proves
    note: >-
      Definition 4.1 and Theorem 4.2 construct the modular permutations sigma_k
      and prove that, for odd k, sigma_k has taxicab breadth at least k + 2;
      the reverse implication of the compared theorem
      odd_minimal_prolific_classification recovers this for the positive
      modular permutation. The paper also establishes that a permutation is
      k-prolific iff its plot has taxicab breadth >= k + 2 (Theorem 2.25) and
      the minimal size m(k) = ceil(k^2/2 + 2k + 1) (Theorem 3.4, Corollary
      4.3); these are cited, not formalized, here. It poses Conjecture 5.1
      (uniqueness up to symmetry for odd k), which the compared theorems
      settle in the breadth formulation. Read in full (arXiv v3).
  - title: "A combination problem"
    authors:
      - "Severin Hertzsprung"
    id: "https://archive.org/details/tidsskriftforma00zeutgoog"
    type: paper
    location: "Zeuthen T. (5) V, 13-17 (1887) (Tidsskrift for Mathematik, fifth series, vol. 5; Danish original title En Kombinationsopgave; JFM 19.0198.02), problem statement on page 13"
    relationship: independently-proves
    note: >-
      The problem asks for the arrangements of 1, ..., n in which adjacent
      entries never differ by 1, and its parenthesis states that for n = 4
      there are only two, 2413 and its reverse 3142. For permutations this
      condition is breadth at least 3, so at m = 1 the compared odd
      classification, count and orbit theorems independently prove this
      four-point case. Hertzsprung refers to his earlier discussion (1879,
      p. 140), which is not recorded as read [to check]. Read depth: the
      problem statement and parenthesis on page 13 read in the digitized
      volume; the rest of the article is not recorded as read [to check].
    author_endorsement: not-contacted
  - title: "Counting Fixed-Length Permutation Patterns"
    authors:
      - "Cheyne Homberger"
    id: "https://doi.org/10.61091/ojac-703"
    type: paper
    location: "Online Journal of Analytic Combinatorics 7 (2012) (arXiv:1211.7117), expansion of F(z, 0) after Corollary 11, Definition 21 and Figure 3"
    relationship: independently-proves
    note: >-
      The bond-free generating function F(z, 0) = 1 + z + 2z^4 + 14z^5 + ...
      gives two bond-free permutations of length four, the count in
      odd_minimal_prolific_card_eq_two at m = 1. Figure 3 gives pi(4) =
      3614725 with minimum gap 4 and a symmetry orbit of order two, so two
      permutations of length seven with breadth at least 4; the compared
      even_strip_lower_bound at r = 2 states that lower bound. The credit is
      limited to these two numerical cases; the even comparison gives
      neither equality nor the witnesses. Read depth: the expansion of
      F(z, 0) (page 6) and Definition 21 through Corollary 23 with Figure 3
      (pages 9 and 10) read in arXiv:1211.7117v1; the rest is not recorded
      as read [to check].
    author_endorsement: not-contacted
  - title: "Permutations all of whose patterns of a given length are distinct"
    authors:
      - "Peter Hegarty"
    id: "https://doi.org/10.1016/j.jcta.2013.06.006"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 120(7) (2013), 1663-1671, Section 3, both tables and Conjecture 3.1 (author's revised text, math.chalmers.se/~hegarty/perm_pattern_revised_june7.pdf; arXiv:1206.0966v2 predates the tables and the conjecture)"
    relationship: independently-proves
    note: >-
      Hegarty enumerated exactly one symmetric pair of k-separators at
      (pattern length, permutation length) = (3, 4) and (9, 12), with
      representatives 3142 and (5,10,2,7,12,4,9,1,6,11,3,8). At deletion
      counts 1 and 3 (m = 1, 2) the compared odd classification, count and
      orbit theorems recover those cases in the breadth formulation, using
      Bevan-Homberger-Tenner Theorem 2.25 for the separator interpretation.
      Hegarty's Conjecture 3.1 goes beyond these enumerated cases. Read
      depth: Section 3 of the revised text read for this entry, and the
      arXiv v2 read in full as recorded in the companion's
      references-checked.md.
  - title: "Maximin Latin Hypercube Designs in Two Dimensions"
    authors:
