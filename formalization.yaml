alignment:
  namespace: "MinimalProlificChallenge"
  statements:
    - source: "Theorem 1 (odd-k classification, BHT 2018 Conjecture 5.1 under breadth criterion)"
      lean: "MinimalProlificChallenge.odd_minimal_prolific_classification"
      module: "Challenge"
      status: proved
      note: "For every m >= 1 (odd k = 2m - 1, n = 2m^2 + 2m, d = 2m + 1), HasBreadthAtLeast d w iff IsSigmaPlus m w or IsSigmaMinus m w."
    - source: "Theorem 1 (exact count = 2 for every odd k)"
      lean: "MinimalProlificChallenge.odd_minimal_prolific_card_eq_two"
      module: "Challenge"
      status: proved
      note: "Nat.card { w : Equiv.Perm (Fin (2*m^2 + 2*m)) // HasBreadthAtLeast (2*m + 1) w } = 2."
    - source: "Theorem 1 (single D_4 symmetry orbit of size 2)"
      lean: "MinimalProlificChallenge.odd_minimal_prolific_dihedral_orbit"
      module: "Challenge"
      status: proved
      note: "The two valid permutations are distinct, mutually reverse/complement/inverse, and fixed by 90-degree rotation."
    - source: "Lemma 1 (2D radius-m Lee-sphere tiling rigidity)"
      lean: "MinimalProlificChallenge.lee_tiling_classification"
      module: "Challenge"
      status: proved
      note: "Every radius-m Lee-sphere tiling T of Z^2 containing (0, 0) equals LambdaPlus m or LambdaMinus m."
    - source: "Theorem 2 (even-k factorial lower bound 2 * (r - 1)!)"
      lean: "MinimalProlificChallenge.even_strip_lower_bound"
      module: "Challenge"
      status: proved
      note: "For every r >= 2 (even k = 2r - 2, n = 2r^2 - 1, d = 2r), at least 2 * (r - 1)! permutations have taxicab breadth >= 2r."

