  - title: "Classificação dos códigos perfeitos bidimensionais na métrica de Lee"
    authors:
      - "Claudio Qureshi"
      - "Sueli Costa"
    id: "https://doi.org/10.14209/sbrt.2013.176"
    type: paper
    location: "Anais do XXXI Simpósio Brasileiro de Telecomunicações (SBrT 2013), Section III, Theorem 1(2), Lemma 6 and Corollary 1"
    relationship: independently-proves
    note: >-
      Theorem 1(2) states that a perfect e-error-correcting Lee code C on
      the torus Z_q x Z_q, linear or not, is c + D_e or c + conj(D_e) for
      any c in C, where D_e is generated by (e, e + 1) and (-(e + 1), e)
      and conj(x, y) = (-x, y); Corollary 1 says the code is unique up to
      translation and conjugation. Translating a codeword to 0 and lifting
      the code to Z^2 (the Lee balls lift without overlap when q >= 2e + 1)
      gives a tiling containing the origin, so lee_tiling_classification
      independently proves this two-form classification of an existing
      code; the generators of D_e give one of the two Lean lattices and
      conjugation gives the other. The credit is limited to that
      classification; existence and group structure (Theorem 1(1), 1(3))
      are separate. Read depth: Section III through Theorem 1, Lemma 6,
      Corollary 1 and Observation 1 read in the SBrT proceedings PDF; the
      proofs of Lemmas 2 to 5 are not recorded as read [to check].
    author_endorsement: not-contacted
