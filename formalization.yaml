# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Minimal k-Prolific Permutations for Every Odd k: Exact Uniqueness via Lee-Sphere Tilings"
  description: >-
    Lean 4 + Mathlib formalization (zero sorry, zero native_decide, standard
    axioms only) of the companion paper's proof of Conjecture 5.1 of Bevan,
    Homberger, and Tenner (JCTA 153, 2018) for every odd k = 2m - 1 >= 1 in
    its taxicab-breadth formulation: at minimal size n = 2m^2 + 2m and modulus
    N = 2m^2 + 2m + 1, a permutation w of Fin n has taxicab breadth at least d
    = 2m + 1 iff w(i) + 1 = +(2m + 1)(i + 1) (mod N) or w(i) + 1 = -(2m + 1)(i
    + 1) (mod N) for all i, giving exactly 2 valid permutations forming a
    single D_4 symmetry orbit. Also formalizes the 2D radius-m Lee-sphere
    tiling classification (every tiling of Z^2 containing (0, 0) equals
    LambdaPlus m or LambdaMinus m) and the even-k factorial lower bound 2 * (r
    - 1)! = 2 * (k/2)! at n = 2r^2 - 1, d = 2r for every r >= 2. Equivalence
    between taxicab breadth >= k + 2 and k-prolific permutations (plus minimal
    size m(k)) is cited from Bevan, Homberger, and Tenner (2018, Theorem 2.25
    and Corollary 4.3). The companion page links to the dated preprint
    (2026-11-23-v1) and the verification archive, which includes a summary of
    the prior-work searches:
    https://mathdiscoveries.org/results/minimal-prolific-permutations.
    Coverage by this package's Palomar comparison: of the companion paper's 5
    main results, 3 are compared in Lean in full (60%; Theorem 1 in its
    taxicab-breadth formulation, Theorem 2 and Lemma 3); Proposition 4 is by
    written proof only and Proposition 5 by certificate only; Conjecture 6 is
    open and not counted. Abstract claims: 3 of 3 compared in Lean (100%).
    Generated and checked by AI research agents built and directed by Tyler B.
    Hughes. No human mathematician has yet refereed the proof.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05A05", "52C20"]

sources:
  - title: "Minimal k-Prolific Permutations for Every Odd k: Exact Uniqueness via Lee-Sphere Tilings"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/minimal-prolific-permutations"
    type: paper
    location: "https://mathdiscoveries.org/results/minimal-prolific-permutations"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper (dated preprint 2026-11-23-v1). It states and proves
      in writing every compared statement of this package (Theorem 1, Lemma 3
      and Theorem 2), and the Lean work formalizes them; the formalization
      presents no result that the paper does not. The equivalence of taxicab
      breadth >= k + 2 with k-prolific permutations and the minimal size m(k)
      are cited from Bevan, Homberger, and Tenner (Theorem 2.25 and Corollary
      4.3) and are not formalized. Three logged prior-work searches (253
      queries across arXiv, Google Scholar, CORE, OEIS A074148/A322481,
      zbMATH, OpenAlex, Semantic Scholar, Math Stack Exchange, and
      MathOverflow; 72 candidates evaluated) found no prior proof of
      Conjecture 5.1 for odd k. Golomb and Welch (1970) and Miller (2009) are
      unread [to check]; direct Scholar cited-by traversal, MathSciNet,
      doctoral theses, and non-English literature were not searched. AI
      research agents built and directed by Tyler B. Hughes generated and
      checked this work. No human mathematician has yet refereed the proof.
  - title: "Prolific permutations and permuted packings: Downsets containing many large patterns"
    authors:
      - "David Bevan"
      - "Cheyne Homberger"
      - "Bridget Eileen Tenner"
    id: "https://doi.org/10.1016/j.jcta.2017.08.006"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 153 (2018), 98-121 (arXiv:1608.06931v3), Theorem 2.25, Corollary 4.3, Definition 4.1 and Theorem 4.2 (odd k, breadth formulation), and Conjecture 5.1"
    relationship: independently-proves
    note: >-
      Definition 4.1 and Theorem 4.2 construct the modular permutations sigma_k
      and prove that, for odd k, sigma_k has taxicab breadth at least k + 2;
      the reverse implication of the compared theorem
      odd_minimal_prolific_classification recovers this for the positive
      modular permutation. The paper also establishes that a permutation is
      k-prolific iff its plot has taxicab breadth >= k + 2 (Theorem 2.25) and
      the minimal size m(k) = ceil(k^2/2 + 2k + 1) (Theorem 3.4, Corollary
      4.3); these are cited, not formalized, here. It poses Conjecture 5.1
      (uniqueness up to symmetry for odd k), which the compared theorems
      settle in the breadth formulation. Read in full (arXiv v3).
  - title: "Permutations all of whose patterns of a given length are distinct"
    authors:
      - "Peter Hegarty"
    id: "https://doi.org/10.1016/j.jcta.2013.06.006"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 120(7) (2013), 1663-1671 (arXiv:1206.0966v2)"
    relationship: background
    note: "Equivalent k-separators formulation and qualitative tilted-checkerboard conjecture without uniqueness proof."
  - title: "Maximin Latin Hypercube Designs in Two Dimensions"
    authors:
      - "Edwin R. van Dam"
      - "Bart Husslage"
      - "Dick den Hertog"
      - "Hans Melissen"
    id: "https://doi.org/10.1287/opre.1060.0317"
    type: paper
    location: "Operations Research 55(1) (2007), 158-169, Constructions 2 and 3 and Proposition 2"
    relationship: independently-proves
    note: >-
      Earlier proof of the minimal size m(k) in two-dimensional L_1-maximin
      Latin hypercube designs. Its Constructions 2 and 3 show that a
      permutation plot with separation at least d exists at the smallest
      admissible size for each d >= 3; the compared theorems
      odd_minimal_prolific_card_eq_two (odd d) and even_strip_lower_bound
      (even d) recover that attainment at those sizes. The credit is limited
      to attainment; the general size formula is cited, not formalized.
  - title: "The minimum Manhattan distance and minimum jump of permutations"
    authors:
      - "Simon R. Blackburn"
      - "Cheyne Homberger"
      - "Peter Winkler"
    id: "https://doi.org/10.1016/j.jcta.2018.09.002"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 161 (2019), 364-386 (arXiv:1706.01557)"
    relationship: background
    note: "Related breadth and Manhattan-distance results resolving a separate conjecture of Bevan, Homberger, and Tenner (2018)."
  - title: "50 Years of the Golomb-Welch Conjecture"
    authors:
      - "Peter Horak"
      - "Dongryul Kim"
    id: "https://doi.org/10.1109/tit.2017.2786675"
    type: paper
    location: "IEEE Transactions on Information Theory 64(4) (2018), 3048-3061 (arXiv:1706.03589), Section V.B, discussion following Conjecture 44 (n = 2)"
    relationship: independently-proves
    note: >-
      Survey of Lee-sphere tilings and Golomb-Welch packing rigidity; it
      reports the known classification of two-dimensional (periodic)
      radius-one Lee-sphere tilings. The compared theorem
      lee_tiling_classification at m = 1 independently proves the plane
      case, which includes the periodic one. The survey reports that result
      rather than originating it.
  - title: "Non-periodic Tilings of ℝⁿ by Crosses"
    authors:
      - "Peter Horak"
      - "Bader AlBdaiwi"
    id: "https://doi.org/10.1007/s00454-011-9373-5"
    type: paper
    location: "Discrete & Computational Geometry 47(1) (2012), 1-16, Theorem 2, its planar proof and the remark following it"
    relationship: independently-proves
    note: >-
      Primary source for the planar case: Theorem 2 proves that every tiling
      of the plane by crosses is a lattice tiling, and the remark after its
      proof gives the two tilings containing the cross centered at the
      origin. The radius-one Lee sphere is the five-cell cross, so
      lee_tiling_classification at m = 1 independently proves this case; the
      source also treats dimension three. Metadata checked against Crossref;
      the passages were located by the cross-family editorial audit, and the
      paywalled text is not recorded as read in full by the package authors.
    author_endorsement: not-contacted
  - title: "Sui mosaici dello spazio di dimensione n"
    authors:
      - "Emil Molnár"
    type: paper
    location: "Atti della Accademia Nazionale dei Lincei, Rendiconti, Classe di Scienze Fisiche, Matematiche e Naturali, serie 8, 51 (1971), 177-185 (Zbl 0257.05024), main classification specialized to dimension two"
    relationship: independently-proves
    note: >-
      Earlier classification of lattice tilings by crosses in every
      dimension, credited by Horak and AlBdaiwi (2012). In dimension two it
      gives one lattice cross tiling up to equivalence, which
      lee_tiling_classification at m = 1 independently recovers. Metadata
      checked against zbMATH; the paper is not recorded as read.
    author_endorsement: not-contacted
  - title: "On the existence of complete coverings of Lee spheres"
    authors:
      - "J. Zhang"
      - "Y. Zhou"
    id: "https://arxiv.org/abs/2610.34805"
    type: paper
    location: "arXiv:2610.34805 (2026), Theorem III.1"
    relationship: independently-proves
    note: >-
      Concurrent local complete-covering form of 2D radius-m Lee-sphere tiling
      rigidity. The compared theorem lee_tiling_classification independently
      recovers the two orientations of Theorem III.1 for complete coverings
      induced by a tiling of the whole plane; the comparison assumes a global
      tiling of Z^2 and classifies its centre set, while Theorem III.1 also
      treats a local covering with no ambient tiling.
  - title: "Perfect dominating sets"
    authors:
      - "Marilynn Livingston"
      - "Quentin F. Stout"
    type: paper
    location: "Congressus Numerantium 79 (1990), 187-203, Section 2.2 and Theorem 2.5"
    relationship: independently-proves
    note: >-
      Section 2.2 characterizes the two-dimensional tori with a perfect
      distance-d dominating set (Theorem 2.5) and states that each such set is
      unique up to isomorphism, with the proof in its reference [16]; it also
      notes that a set on a torus whose periods are both at least 2d + 1
      unrolls to one on the infinite grid. Lifting such a set to Z^2 and
      applying the compared theorem lee_tiling_classification (radius m = d)
      recovers that uniqueness for those tori. Section 2.2 was read in the
      authors' open copy; the reference [16] holding the uniqueness proof is
      unread [to check]. Not cited by the companion paper.

