      4. Lemma 4.4 (page 13): for an r-perfect code P of a component of a direct
      product of cycles, r >= 2 and each length at least 2r + 2, and x in P,
      every point x + sum alpha_i x^i with integer alpha_i and x^i in the local
      vector set B(x) lies in P, where B(x) (page 13, (6)) is the set of
      offsets from x to nearby code vertices. For two factors this follows
      from lee_tiling_classification at m = r: lifting the component to Z^2
      along (1, 1) and (1, -1), with x at the origin (the lift described in the
      Zerovnik 2008 entry), the preimage of P is LambdaPlus r or LambdaMinus r,
      a lattice containing every lift of a code vertex, so every integer
      combination of the offsets in B(x) projects into P. The credit is
      limited to two factors; the lift is written here, not in Lean. The paper
      does not state a classification for two factors (it refers to Jerebic,
      Klavzar and Spacapan 2005, listed above), and the rest of the paper is
      not recorded as read.
    author_endorsement: not-contacted
