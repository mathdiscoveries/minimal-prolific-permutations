    authors:
      - "Peter Horak"
      - "Bader AlBdaiwi"
    id: "https://doi.org/10.1007/s00454-011-9373-5"
    type: paper
    location: "Discrete & Computational Geometry 47(1) (2012), 1-16, Theorem 2, its planar proof and the remark following it"
    relationship: independently-proves
    note: >-
      Later proof of the planar case: Theorem 2 proves that every tiling
      of the plane by crosses is a lattice tiling, and the remark after its
      proof gives the two tilings containing the cross centered at the
      origin. The radius-one Lee sphere is the five-cell cross, so
      lee_tiling_classification at m = 1 independently proves this case; the
      source also treats dimension three. Read depth: the statement of
      Theorem 2, its proof for n = 2 (Claims 19 and 20) and the closing
      remark read in the publisher's open copy; Theorem 1 and the n = 3 case
      are not recorded as read [to check].
    author_endorsement: not-contacted
  - title: "Sui mosaici dello spazio di dimensione n"
    authors:
      - "Emil Molnár"
    type: paper
    location: "Atti della Accademia Nazionale dei Lincei, Rendiconti, Classe di Scienze Fisiche, Matematiche e Naturali, serie 8, 51 (1971), 177-185 (Zbl 0257.05024), main classification specialized to dimension two"
    relationship: independently-proves
    note: >-
      Earlier classification of lattice tilings by crosses in every
      dimension, credited by Horak and AlBdaiwi (2012). Section 4, equation
      (18), pp. 184-185, counts the equivalence classes of lattice cross
      tilings of the integer grid; in dimension two, 2n + 1 = 5 is prime and
      (18) gives one class. The two centre sets classified by
      lee_tiling_classification at m = 1 are mirror images, so they form
      that one class under reflection. Read depth: the cross-family
      editorial referee (blind GPT audit seat of 2026-11-26) checked Section
      4 and equation (18) in the copy at
      academia.edu/157009701; the package authors could not obtain the
      Lincei scan and have not read the paper [to check]. Metadata checked
      against zbMATH.
    author_endorsement: not-contacted
  - title: "A new approach towards the Golomb-Welch conjecture"
    authors:
      - "Peter Horak"
      - "Otokar Grošek"
    id: "https://doi.org/10.1016/j.ejc.2013.10.010"
    type: paper
    location: "European Journal of Combinatorics 38 (2014), 12-22, proof of Theorem 6, case (i) (arXiv:1205.4875v3, preprint pages 7 and 8)"
    relationship: independently-proves
    note: >-
      For every radius r, case (i) of the proof of Theorem 6 states that a
      tiling of Z^2 by Lee spheres of size 2r^2 + 2r + 1 "is unique, up to a
      symmetry" and gives the cyclic lattice construction (e1 -> r, e2 -> r +
      1 in Z_k); no proof of uniqueness is given there. The two centre sets
      of lee_tiling_classification are reflections of one another, so the
      compared theorem independently proves this uniqueness statement for
      tilings containing the origin. Read depth: arXiv:1205.4875v3 read in
      full.
    author_endorsement: not-contacted
  - title: "Perfect domination in regular grid graphs"
    authors:
      - "Italo J. Dejter"
    id: "https://arxiv.org/abs/0711.4343"
    type: paper
    location: "Australasian Journal of Combinatorics 42 (2008), 99-114, Section 4, Figure 6 and the remark after Corollary 9"
    relationship: independently-proves
    note: >-
      Section 4 states that the plane grid has just one 1-perfect code up to
      symmetry, the sublattice generated by (1, 2) and (2, -1), and after
      Corollary 9 that for each d there are only two partitions of the grid
      into copies of a d-perfect code, the two enantiomorphic presentations.
      An anchored plane perfect code is the centre set of a Lee-sphere
      tiling, so lee_tiling_classification independently proves the
      radius-one classification and the two mirror families at every
      radius. Read depth: the opening of Section 4 with Figure 6, and
      Corollary 9 with the paragraph after it, read in arXiv:0711.4343v4; the
      rest of the paper is not recorded as read [to check].
    author_endorsement: not-contacted
  - title: "Enumerating and decoding perfect linear Lee codes"
    authors:
      - "Bader AlBdaiwi"
      - "Peter Horak"
      - "Lorenzo Milazzo"
    id: "https://doi.org/10.1007/s10623-009-9273-3"
    type: paper
    location: "Designs, Codes and Cryptography 52(2) (2009), 155-162, Theorem 18"
    relationship: independently-proves
    note: >-
      At n = 2 and q = 5, Theorem 18 gives one isomorphism class of linear
      perfect radius-one Lee codes on (Z/5Z)^2. Such a code contains 0, and
      its inverse image in Z^2 is a radius-one Lee-sphere tiling containing
      the origin, so lee_tiling_classification at m = 1 forces one of the two
      mirror lattices and independently proves this uniqueness case. The
      credit is limited to that case. Metadata checked against Crossref; the
      theorem was located by the cross-family editorial audit, and the
      paywalled paper has not been read by the package authors [to check].
    author_endorsement: not-contacted
  - title: "Classificação dos códigos perfeitos bidimensionais na métrica de Lee"
    authors:
      - "Claudio Qureshi"
      - "Sueli Costa"
    id: "https://doi.org/10.14209/sbrt.2013.176"
    type: paper
    location: "Anais do XXXI Simpósio Brasileiro de Telecomunicações (SBrT 2013), Section III, Theorem 1(2), Lemma 6 and Corollary 1"
    relationship: independently-proves
    note: >-
      Theorem 1(2) states that a perfect e-error-correcting Lee code C on
      the torus Z_q x Z_q, linear or not, is c + D_e or c + conj(D_e) for
      any c in C, where D_e is generated by (e, e + 1) and (-(e + 1), e)
      and conj(x, y) = (-x, y); Corollary 1 says the code is unique up to
      translation and conjugation. Translating a codeword to 0 and lifting
      the code to Z^2 (the Lee balls lift without overlap when q >= 2e + 1)
      gives a tiling containing the origin, so lee_tiling_classification
      independently proves this two-form classification of an existing
      code; the generators of D_e give one of the two Lean lattices and
      conjugation gives the other. The credit is limited to that
      classification; existence and group structure (Theorem 1(1), 1(3))
      are separate. Read depth: Section III through Theorem 1, Lemma 6,
      Corollary 1 and Observation 1 read in the SBrT proceedings PDF; the
      proofs of Lemmas 2 to 5 are not recorded as read [to check].
    author_endorsement: not-contacted
  - title: "On the existence of complete coverings of Lee spheres"
    authors:
      - "J. Zhang"
      - "Y. Zhou"
    id: "https://arxiv.org/abs/2610.34805"
    type: paper
    location: "arXiv:2610.34805 (2026), Theorem III.1"
    relationship: independently-proves
    note: >-
      Concurrent local complete-covering form of 2D radius-m Lee-sphere tiling
      rigidity. The compared theorem lee_tiling_classification independently
      recovers the two orientations of Theorem III.1 for complete coverings
      induced by a tiling of the whole plane; the comparison assumes a global
      tiling of Z^2 and classifies its centre set, while Theorem III.1 also
      treats a local covering with no ambient tiling.
  - title: "Perfect dominating sets"
    authors:
      - "Marilynn Livingston"
      - "Quentin F. Stout"
    type: paper
    location: "Congressus Numerantium 79 (1990), 187-203, Section 2.2 and Theorem 2.5"
    relationship: independently-proves
    note: >-
      Section 2.2 characterizes the two-dimensional tori with a perfect
      distance-d dominating set (Theorem 2.5) and states that each such set is
      unique up to isomorphism, with the proof in its reference [16]; it also
      notes that a set on a torus whose periods are both at least 2d + 1
      unrolls to one on the infinite grid. Lifting such a set to Z^2 and
      applying the compared theorem lee_tiling_classification (radius m = d)
      recovers that uniqueness for those tori. Section 2.2 was read in the
      authors' open copy; the reference [16] holding the uniqueness proof is
      unread [to check]. Not cited by the companion paper.

