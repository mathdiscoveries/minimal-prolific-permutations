      Reported by the blind cross-family editorial audit, not read here:
      after Problem 6.15, Figure 6.8 shows the two ways to fill a corner
      beside a placed cross, each choice forces the whole tiling, and
      Figure 6.9 shows the two completions, exchanged by reflection. That is
