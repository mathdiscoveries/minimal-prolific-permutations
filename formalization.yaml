fidelity:
  divergences: >-
    The Lean 4 theorems formalize the taxicab-breadth formulation
    (HasBreadthAtLeast (k + 2) w) directly; equivalence with the k-deletion
    definition of k-prolific permutations and the minimal-size formula m(k) is
    cited from Bevan, Homberger, and Tenner (JCTA 153, 2018, Theorem 2.25 and
    Corollary 4.3) and cross-checked computationally for n <= 7 in the
    companion verification archive. The companion paper's even-k
    torus-separated classification (Proposition 4) and exhaustive k <= 8 counts
    (Proposition 5) are outside this Lean package.

