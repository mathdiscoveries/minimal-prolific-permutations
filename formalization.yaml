      Earlier proof of the minimal size m(k) in two-dimensional L_1-maximin
      Latin hypercube designs. Its Constructions 2 and 3 show that a
      permutation plot with separation at least d exists at the smallest
      admissible size for each d >= 3; the compared theorems
      odd_minimal_prolific_card_eq_two (odd d) and even_strip_lower_bound
      (even d) recover that attainment at those sizes. The credit is limited
      to attainment; the general size formula is cited, not formalized.
      Read depth: the statements of Constructions 2 (even d) and 3 (odd d)
      and of Proposition 2 read in the authors' copy
