    - source: "Lemma 3 (2D radius-m Lee-sphere tiling rigidity)"
      lean: "MinimalProlificChallenge.lee_tiling_classification"
      module: "Challenge"
      status: proved
      note: "Every radius-m Lee-sphere tiling T of Z^2 containing (0, 0) equals LambdaPlus m or LambdaMinus m."
    - source: "Theorem 2 (even-k factorial lower bound 2 * (r - 1)!)"
      lean: "MinimalProlificChallenge.even_strip_lower_bound"
      module: "Challenge"
